name: CoolapkForMac
options:
  bundleIdPrefix: com.mora
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.18.1"
    CURRENT_PROJECT_VERSION: "21"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  CoolapkKit:
    path: Packages/CoolapkKit
  LiquidGlassUI:
    path: Packages/LiquidGlassUI

targets:
  CoolapkForMac:
    type: application
    platform: macOS
    sources:
      - path: CoolapkForMac
        excludes:
          - "Info.plist"
          - "CoolapkForMac.entitlements"
          - "Resources"
      - path: CoolapkForMac/Resources/Emoji
        type: folder
      # Icon Composer 图标（macOS 26 的 .icon 文稿），由 actool 编进 Assets.car
      - path: CoolapkForMac/AppIcon.icon
        type: file
    dependencies:
      - package: CoolapkKit
      - package: LiquidGlassUI
    settings:
      base:
        PRODUCT_NAME: Coolapk
        PRODUCT_BUNDLE_IDENTIFIER: com.mora.coolapkformac
        INFOPLIST_FILE: CoolapkForMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CoolapkForMac/CoolapkForMac.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
